<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="홍익대학교 산업디자인학과 2025 졸업전시 What If 프로젝트 목록.">
  <meta name="theme-color" content="#ffffff">
  <title>Projects | What If</title>
  <link rel="stylesheet" href="css/base/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/modules/site-chrome.js"></script>
  <script type="module" src="js/main.js"></script>
</head>

<body data-page="projects">
  <a class="skip-link" href="#contents">본문 바로가기</a>
  <div data-site-header-slot></div>

  <main id="contents">
    <nav class="projects-page__categories" aria-label="프로젝트 카테고리">
      <div class="inner-box">
        <div class="part-box projects-page__filter-part">
          <ul class="category-nav__list" lang="en">
            <li><button class="category-nav__btn is-active" type="button" data-filter="All" aria-pressed="true">All</button></li>
            <li><button class="category-nav__btn" type="button" data-filter="Graphic" aria-pressed="false">Graphic</button></li>
            <li><button class="category-nav__btn" type="button" data-filter="AI" aria-pressed="false">AI</button></li>
            <li><button class="category-nav__btn" type="button" data-filter="Branding" aria-pressed="false">Branding</button></li>
            <li><button class="category-nav__btn" type="button" data-filter="etc." aria-pressed="false">etc.</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="site-section site-section--projects-page" aria-label="프로젝트 목록">
      <div class="inner-box">
        <h1 class="visually-hidden">Projects</h1>
        <div class="part-box projects-page__grid-part">
          <ul class="projects-grid">
            <li class="project-card" data-project-id="1" data-category="Branding, Graphic, AI, etc." tabindex="0">
              <div class="project-card__thumb">
                <img src="images/thumb_tp.png" alt="" loading="lazy" width="1000" height="1000">
              </div>
              <div class="project-card__hover">
                <div class="project-card__info">
                  <h2 class="project-card__title">Tokyo&amp;Pearl</h2>
                  <p class="project-card__category">Branding, Graphic, AI, etc.</p>
                </div>
              </div>
            </li>
            <li class="project-card" data-project-id="2" data-category="Graphic, AI" tabindex="0">
              <div class="project-card__thumb">
                <img src="images/thumb_stau.png" alt="" loading="lazy" width="1000" height="1000">
              </div>
              <div class="project-card__hover">
                <div class="project-card__info">
                  <h2 class="project-card__title">STAU</h2>
                  <p class="project-card__category">Graphic, AI</p>
                </div>
              </div>
            </li>
            <li class="project-card" data-project-id="3" data-category="Graphic" tabindex="0">
              <div class="project-card__thumb">
                <img src="images/thumb_콘텐츠-웨이브.png" alt="" loading="lazy" width="1000" height="1000">
              </div>
              <div class="project-card__hover">
                <div class="project-card__info">
                  <h2 class="project-card__title">WAVVE</h2>
                  <p class="project-card__category">Graphic</p>
                </div>
              </div>
            </li>
            <li class="project-card" data-project-id="4" data-category="Graphic, Branding, etc." tabindex="0">
              <div class="project-card__thumb">
                <img src="images/thumb_etc.png" alt="" loading="lazy" width="1000" height="1000">
              </div>
              <div class="project-card__hover">
                <div class="project-card__info">
                  <h2 class="project-card__title">etc.</h2>
                  <p class="project-card__category">Graphic, Branding, etc.</p>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <dialog class="project-modal" data-project-modal aria-labelledby="project-modal-title">
    <div class="project-modal__panel">
      <header class="project-modal__header">
        <button class="project-modal__close" type="button" aria-label="프로젝트 상세 닫기" data-project-modal-close>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      </header>
      <div class="project-modal__scroll" data-project-modal-scroll>
        <div class="project-modal__content">
          <img class="project-modal__image" src="images/test-img.png" alt="" decoding="async" data-project-modal-image>
          <div class="project-modal__text">
            <h2 class="project-modal__title" id="project-modal-title" data-project-modal-title></h2>
            <p class="project-modal__subtitle" data-project-modal-subtitle></p>
            <div class="project-modal__body" data-project-modal-body></div>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <div data-site-footer-slot></div>
</body>

</html>
